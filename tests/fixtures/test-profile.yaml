# 测试用学校档案（虚构学校），与 make_samples.py 生成的样例配套
school: { name: 测试大学, code: test, department: null }
degree: bachelor
cohort: 2026
status: draft
sources:
  - { title: 测试大学本科毕业论文撰写规范, url: https://example.edu.cn/rules.pdf }
maintainers: [stevenchenpk]
last_verified: 2026-10-11
