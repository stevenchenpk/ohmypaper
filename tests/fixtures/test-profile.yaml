  reference_entries: { font_cn: 宋体, font_en: Times New Roman, size_pt: 10.5 }
  header: { required: true, text: 某某大学本科毕业论文 }
  page_numbers: { front_matter: upper_roman, body: arabic, body_starts_at: 1, position: footer_center }
