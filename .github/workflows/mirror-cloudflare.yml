name: Mirror to Cloudflare Pages
# 国内可访问镜像（未启用：未配置 secrets/vars 时自动跳过，不影响 GitHub Pages）
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mirror-cloudflare
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.flag.outputs.enabled }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
    steps:
      - id: flag
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CF_PAGES_PROJECT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare 镜像已配置，将部署。"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare 镜像未配置（需要 secrets CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID 与 var CF_PAGES_PROJECT），跳过部署。"
          fi
  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }}
