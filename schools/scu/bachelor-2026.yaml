# 四川大学 本科 2026 届
# 全校格式规范是 2018 年版（川大教〔2018〕143号附件5），教务处 2024-09-28 重新挂出 PDF 附件。
# 参考文献著录：理工医类按本文件；文科类由各学院自定并报教务处备案，本档案不覆盖文科学院规则。

school:
  name: 四川大学
  code: scu
  department: null

degree: bachelor
cohort: 2026
status: draft

sources:
  - title: 四川大学本科毕业论文（设计）格式和参考文献著录要求
    url: https://jwc.scu.edu.cn/info/1063/8032.htm
    published: 2024-09-28
    note: 教务处官网，正文为 PDF 附件。附件未能直接读取，下方条文取自哲学系转载版，需核对 2024 版是否有改动。
  - title: 四川大学本科毕业论文（设计）格式和参考文献著录要求（川大教〔2018〕143号附件5）
    url: https://zxx.scu.edu.cn/info/1106/1198.htm
    published: 2020-09-20
    note: 哲学系官网转载全文。
  - title: 关于开展2026届本科毕业论文（设计）学术不端行为检测工作的通知
    url: https://jwc.scu.edu.cn/info/1069/10518.htm
    published: 2026-04-08
    note: 教务处官网。AIGC 比例出自此通知，通知称依据川大教〔2025〕28号。

maintainers: [stevenchenpk]
last_verified: 2026-10-11

references:
  # 原文："参考文献的著录要求摘自 GB/T 3179-92"。GB/T 3179 是期刊编排格式标准，不是 GB/T 7714。
  standard: other
  # 原文只对理工医类规定"著录引文的参考文献采用顺序编码制"，文科由学院定，全校层面留空。
  style: null
  min_count: null      # 学校文件未规定；材料学院 2022 届通知要求 20 篇以上，属学院规定
  min_foreign: null

format:
  paper: A4
  margins_cm: { top: 2.5, bottom: 2.5, left: 2.5, right: 2.0, gutter: 0 }   # 1.2：页眉边距 1.5cm，页脚边距 1.5cm
  body:
    font_cn: 宋体          # 2.2："文字选用小 4 号宋体"
    size_pt: 12
    line_spacing: 固定值 20 磅   # 1.3
  headings:
    # 2.3.1 / 2.3.2。一级标题字体原文为"标宋黑体"，含义不明，留空。
    - { size_pt: 15, align: center }
    # 二级："4 号宋体加粗（或黑体）"，两种都允许，字体留空。
    - { size_pt: 14, align: center }
    - { font_cn: 楷体, size_pt: 12, align: left }
  reference_entries: null   # 未规定参考文献条目字号
  header: { required: true, text: null }   # 左侧固定文字，右侧为各自论文题目，整行文本因人而异
  page_numbers:
    front_matter: null
    body: null
    body_starts_at: null
    position: footer_center   # 2.9："用 5 号字排在页脚居中"
  header_footer: "“四川大学本科毕业论文”或“四川大学本科毕业设计”用 5 号字居左排，论文题目或设计题目用 5 号字居右排；书眉与正文之间用下划线分隔。（2.8）"
  page_numbering: "用 5 号字排在页脚居中。（2.9）"
  blind_review: null

ai_policy:
  # 2026 届检测通知原文："原则上，文科类毕业论文（设计）AI生成内容占比不超过20%，
  # 理工医科类毕业论文（设计）AI生成内容占比不超过15%。请各学院参考该比例"。按学科不同，单值字段留空。
  aigc_threshold_percent: null
  detector: null          # 原文："学院可以自行选择 AIGC 检测工具"
  # 《四川大学本科教育教学人工智能工具应用规范（试行）》（川大教〔2025〕28号）原文未取到，允许和禁止清单暂空。
  allowed: []
  forbidden: []
  disclosure: null
  penalty: 对于使用AI工具过程中出现的违规行为，按照《四川大学本科教育教学人工智能工具应用规范（试行）》（川大教〔2025〕28号）文件进行处理。
